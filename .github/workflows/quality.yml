name: Code Quality

on:
  push:
    branches:
      - '**'
  workflow_call:

jobs:
  quality-checks:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        task: [lint, typecheck, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Run ${{ matrix.task }}
        run: npm run ${{ matrix.task }}
