name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  release:
    runs-on: ubuntu-24.04
    needs: quality
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if tag is on master
        run: |
          git branch -a --contains ${{ github.ref }}
          if ! git branch -a --contains ${{ github.ref }} | grep -q 'master\|main'; then
            echo "This tag is not on the master/main branch"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/main.js

      - name: Extract release notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          awk -v ver="$version" -f scripts/extract-release-notes.awk CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md entry found for version $version"
            exit 1
          fi

          echo "--- release-notes.md ---"
          cat release-notes.md
          echo "--- end ---"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --notes-file release-notes.md \
            dist/main.js dist/manifest.json
